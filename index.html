<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VishwaGyaan</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1e14;color:#fff;min-height:100vh}
.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#0a1e14}
.logo{color:#f5c77a;font-size:19px;font-weight:700;display:flex;gap:6px}
.badge{background:#22c55e;color:#fff;font-size:11px;padding:5px 12px;border-radius:20px}
h1{text-align:center;font-size:42px;margin:40px 15px 8px;line-height:1.15;font-weight:800}
h1 .g{color:#22c55e} h1 .y{color:#facc15}
.sub{text-align:center;color:#8a9a90;font-size:13px;margin-bottom:20px}
.search{max-width:680px;margin:0 auto;background:#132a1e;border-radius:30px;display:flex;align-items:center;padding:6px 6px 6px 18px;border:1px solid #1f3d2a}
.search input{flex:1;background:transparent;border:none;outline:none;color:white;font-size:15px}
.btns{display:flex;gap:8px}
.b{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-size:16px}
.b1{background:#fff} .b2{background:#22c55e} .b3{background:#facc15}
#ans{max-width:680px;margin:20px auto;background:#112219;border-radius:16px;padding:18px;font-size:14px;line-height:1.6;color:#cbd5d0}
#preview{max-width:680px;margin:10px auto;display:none;text-align:center}
#preview img{max-width:300px;border-radius:12px;border:2px solid #22c55e}
.foot{text-align:center;color:#f5c77a;margin:30px 0 20px;font-size:13px}
</style>
</head>
<body>
<div class="top"><div class="logo">🌾 VishwaGyaan</div><div class="badge">AI Powered</div></div>
<h1>Har Sawal Ka<br><span class="g">Sahi</span> <span class="y">Jawab</span></h1>
<div class="sub">Ab photo ko pehchan ke bhi batayega</div>

<div class="search">
<input id="q" placeholder="Pasta, Sachin, ya photo daalo...">
<div class="btns">
<button class="b b1" onclick="document.getElementById('file').click()">📷</button>
<button class="b b2" onclick="mic()">🎤</button>
<button class="b b3" onclick="searchNow()">↗</button>
</div>
</div>

<input type="file" id="file" accept="image/*" hidden onchange="handleImage(this)">
<div id="preview"><img id="imgPrev"></div>
<div id="ans">Photo daalo, mai bataunga usme kya hai aur uske baare me jankari bhi dunga.</div>
<div class="foot">Created by Ajay Kumar</div>

<script>
async function searchNow(){
 let query=document.getElementById('q').value.trim();
 if(!query) return;
 let box=document.getElementById('ans');
 box.innerHTML=`"${query}" dhoondh raha hu...`;
 try{
  let r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
  let d=await r.json();
  if(d.extract){ box.innerHTML=`<b style="color:#fff;font-size:16px">${d.title}</b><br><br>${d.extract}`; }
  else{ box.innerText=`${query} ke baare me jankari mili.`; }
 }catch(e){ box.innerText=`Network issue.`; }
}

async function handleImage(input){
 if(!input.files[0]) return;
 let file=input.files[0];
 let imgEl=document.getElementById('imgPrev');
 imgEl.src=URL.createObjectURL(file);
 document.getElementById('preview').style.display='block';
 let box=document.getElementById('ans');
 box.innerHTML=`📷 Photo mili...<br>🧠 AI soch raha hai, ye kya hai...`;

 try{
  // 1. Pehchano kya hai - MobileNet
  const model = await mobilenet.load();
  const predictions = await model.classify(imgEl);
  let top = predictions[0]; // sabse jyada wala
  let naam = top.className.split(',')[0]; // english naam

  box.innerHTML=`✅ <b style="color:#facc15">Pehchan gaya!</b><br><br>Ye <b style="color:#fff">${naam}</b> hai (${Math.round(top.probability*100)}% confidence)<br><br>⏳ Ab iske baare me text padh raha hu...`;

  // 2. Text bhi padho - OCR
  const { data: { text } } = await Tesseract.recognize(file, 'hin+eng');
  
  // 3. Dono ka combo answer
  let finalQuery = text.trim().length > 5 ? text.slice(0,40) : naam;
  document.getElementById('q').value = finalQuery;

  // Wikipedia se us cheez ke baare me lao
  let r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(finalQuery)}`);
  let d = await r.json();

  let extra = d.extract ? `<br><br><b>Iske baare me:</b><br>${d.extract}` : '';
  
  box.innerHTML = `
    <b style="color:#22c55e">Photo Analysis:</b><br>
    👁️ Pehchana: <b style="color:#fff">${naam}</b> (${Math.round(top.probability*100)}%)<br>
    ${text.trim() ? `📝 Photo me likha: "${text.slice(0,100)}"` : '' }
    ${extra}
    <br><br><small style="color:#f5c77a">✓ VishwaGyaan AI Vision</small>
  `;

 } catch(e){
  box.innerHTML=`Photo dekh li, par AI ko thodi dikkat aayi.<br>Saaf photo me try karo. Error: ${e.message}`;
 }
}

function mic(){let R=new (window.SpeechRecognition||window.webkitSpeechRecognition)();R.lang='hi-IN';R.start();R.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;searchNow();}}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')searchNow();});
</script>
</body>
</html>
