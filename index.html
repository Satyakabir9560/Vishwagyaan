<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VishwaGyaan - Har Sawal Ka Sahi Jawab</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07150d;color:#fff;min-height:100vh;font-family:'Inter',system-ui;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(600px 300px at 50% -50px,rgba(34,197,94,.35),transparent 60%),radial-gradient(500px 300px at 90% 20%,rgba(250,204,21,.18),transparent 60%);pointer-events:none;z-index:0}
.top{position:relative;z-index:1;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto}
.logo{color:#f5c77a;font-size:20px;font-weight:800;display:flex;gap:8px;align-items:center;font-family:'Plus Jakarta Sans';letter-spacing:-.3px}
.logo span{background:#1a3325;border:1px solid #2a4d36;width:36px;height:36px;display:grid;place-items:center;border-radius:11px;font-size:18px}
.badge{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:11px;font-weight:700;padding:7px 14px;border-radius:100px;box-shadow:0 4px 20px rgba(34,197,94,.45);letter-spacing:.3px}
.hero{position:relative;z-index:1;text-align:center;padding:28px 16px 0}
.hero-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:6px 12px;border-radius:100px;font-size:12px;color:#d1d5db}
.hero-pill i{width:7px;height:7px;background:#22c55e;border-radius:50%;display:inline-block;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
h1{text-align:center;font-size:52px;margin:16px 15px 10px;line-height:1.05;font-weight:800;font-family:'Plus Jakarta Sans';letter-spacing:-1.5px}
h1 .g{color:#22c55e} h1 .y{color:#facc15}
.sub{text-align:center;color:#9db0a5;font-size:14px;margin-bottom:22px}
.search{position:relative;z-index:1;max-width:700px;margin:0 auto;background:rgba(19,42,30,.9);backdrop-filter:blur(16px);border-radius:100px;display:flex;align-items:center;padding:6px 6px 6px 20px;border:1px solid rgba(255,255,255,.12);box-shadow:0 15px 40px rgba(0,0,0,.45)}
.search:focus-within{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18),0 15px 40px rgba(0,0,0,.45)}
.search input{flex:1;background:transparent;border:none;outline:none;color:white;font-size:15px;font-family:'Inter'}
.search input::placeholder{color:#7a8d80}
.btns{display:flex;gap:8px}
.b{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:17px;transition:.2s;display:grid;place-items:center}
.b:active{transform:scale(.9)}
.b1{background:#fff} .b2{background:#22c55e;color:#fff} .b3{background:#facc15;font-size:20px;font-weight:800}
.trend{max-width:700px;margin:14px auto 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.trend span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#e5e7eb;font-size:12.5px;padding:8px 13px;border-radius:100px;cursor:pointer}
.trend span:hover{background:#fff;color:#000}
.trend b{font-size:12px;color:#facc15;font-weight:600}
#ans{position:relative;z-index:1;max-width:700px;margin:20px auto;background:rgba(17,34,25,.92);border-radius:20px;padding:20px;font-size:14.5px;line-height:1.75;color:#d1d5db;border:1px solid rgba(255,255,255,.08)}
#preview{max-width:700px;margin:12px auto;display:none;text-align:center;position:relative;z-index:1}
#preview img{max-width:320px;border-radius:16px;border:2px solid #22c55e}
.features{max-width:700px;margin:18px auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;position:relative;z-index:1;padding:0 16px}
.features div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;text-align:center}
.features div b{display:block;font-size:13px;margin:6px 0 2px}
.features div p{font-size:11.5px;color:#9db0a5;line-height:1.4}
.foot{text-align:center;color:#f5c77a;margin:28px 0 22px;font-size:13px;position:relative;z-index:1}
.foot small{display:block;color:#6b7f72;margin-top:4px;font-size:11px}
.math-box{background:#0f2a1c;border:1px solid #22c55e33;border-radius:14px;padding:14px;margin-top:10px}
.tag{display:inline-block;background:#22c55e;color:#fff;font-size:11px;padding:3px 10px;border-radius:100px;margin-bottom:8px;font-weight:700}
@media(max-width:600px){h1{font-size:38px}.features{grid-template-columns:1fr 1fr}.features div:last-child{grid-column:span 2}}
</style>
</head>
<body>
<div class="top"><div class="logo"><span>🌾</span> VishwaGyaan</div><div class="badge">✦ AI POWERED</div></div>
<div class="hero">
<div class="hero-pill"><i></i> 10,000+ Sawalon Ke Jawab • Live AI</div>
<h1>Har Sawal Ka<br><span class="g">Sahi</span> <span class="y">Jawab</span></h1>
<div class="sub">Likh ke pucho, bol ke pucho, ya photo daal ke pucho — sab milega</div>
</div>
<div class="search">
<input id="q" placeholder="Kuch bhi pucho... jaise Pasta, Sachin, Taj Mahal">
<div class="btns">
<button class="b b1" onclick="document.getElementById('file').click()">📷</button>
